  <rect width="100" height="100" rx="20" fill="#020408"/>
  <rect width="100" height="100" rx="20" fill="url(#g)" opacity="0.9"/>
  <text x="50" y="68" font-family="Arial Black, Arial" font-size="52" font-weight="900" fill="white" text-anchor="middle" filter="url(#glow)">R</text>
